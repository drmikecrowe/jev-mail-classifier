# Generated automatically by `jev-mail configure`. Hand-editing is fine too --
# this file is just for reference / a starting point if you'd rather not use
# the TUI. Secrets never go here: they live in .env and are referenced as
# ${VAR}.

mailbox:
  host: imap.gmail.com
  port: 993
  username: ${IMAP_USERNAME}
  password: ${IMAP_PASSWORD}
  folder: INBOX
  poll_interval_seconds: 60 # used by `watch` only if the server has no IDLE support
  max_emails_per_run: 25 # caps how many unprocessed emails get classified in one run/poll

jev:
  provider: auto # auto | typesafe | openrouter | vercel
  default_threshold: 0.6

# Tier 0 sender table (git-ignored): known senders are decided locally,
# without a Jev call. See senders.example.csv for the format.
# senders_file: senders.csv

# Categories are independent yes/no questions, so one email can match several.
# Only the first `move` among the matched categories, in the order below, runs;
# every other action runs for every match. A bill that is also bulk mail goes to BILLING.
categories:
  BILLING:
    description: "Invoice, bill, receipt, billing statement, or payment request"
    actions:
      - type: move
        folder: BILLING

  ACTION:
    description: "Needs a reply or a task from me"
    threshold: 0.7 # overrides jev.default_threshold for this category
    actions:
      - type: flag
      - type: webhook
        url: ${SLACK_WEBHOOK_URL}

  PERSONAL:
    description: "Written by a person to me, needing no action"
    actions:
      - type: tag
        value: PERSONAL

  MONITOR:
    description: "Automated notice to keep an eye on: alert, shipping update, one-time code"
    actions:
      - type: move
        folder: MONITOR

  BULK:
    description: "Mass mail: newsletter, marketing, promotion, or mailing list"
    actions:
      - type: move
        folder: BULK
